<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#334155">
<title>BSG SCOUT & GUIDE MANAGEMENT PORTAL</title>
<style>
:root{--blue:#2563eb;--purple:#7c3aed;--green:#059669;--orange:#ea580c;--ink:#172033;--muted:#64748b;--bg:#f4f7fb;--card:#fff;--line:#dbe3ef;--danger:#dc2626;--shadow:0 8px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.welcome{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eff6ff,#f5f3ff 48%,#ecfdf5)}
.welcome-card{width:min(1050px,100%);background:#fff;border:1px solid #e6eaf1;border-radius:28px;box-shadow:var(--shadow);padding:34px}
.brand-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{padding:9px 13px;border-radius:14px;font-weight:800;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.08)}.brand.kvs{background:#2563eb}.brand.bsg{background:#059669}.brand.wosm{background:#7c3aed}.brand.wagggs{background:#ea580c}
h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:22px 0 8px}.subtitle{font-size:clamp(16px,2.5vw,21px);color:#475569;margin-bottom:30px}.welcome-options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.option{border:1px solid var(--line);border-radius:22px;padding:24px;background:#fff;transition:.2s;box-shadow:0 4px 15px rgba(15,23,42,.05)}.option:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.option h3{margin:8px 0}.icon{font-size:34px}.option p{color:var(--muted);min-height:44px}.btn{border:0;border-radius:12px;padding:11px 16px;background:#334155;color:#fff;font-weight:700;min-height:44px}.btn.primary{background:var(--blue)}.btn.green{background:var(--green)}.btn.purple{background:var(--purple)}.btn.orange{background:var(--orange)}.btn.danger{background:var(--danger)}.btn.light{background:#eef2f7;color:#243047}.btn.small{padding:8px 11px;min-height:36px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-box{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.close{border:0;background:#eef2f7;border-radius:10px;padding:8px 12px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.notice{padding:12px 14px;border-radius:12px;background:#f1f5f9;margin:12px 0;color:#334155}.notice.success{background:#ecfdf5;color:#065f46}.notice.warn{background:#fff7ed;color:#9a3412}.notice.error{background:#fef2f2;color:#991b1b}
.shell{display:flex;min-height:100vh}.sidebar{width:270px;background:#172033;color:#fff;padding:18px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:40}.side-title{font-weight:900;font-size:18px;padding:8px 8px 3px}.side-sub{font-size:12px;color:#aeb9cc;padding:0 8px 16px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#dbe4f0;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#2b3850;color:#fff}.main{margin-left:270px;width:calc(100% - 270px);min-width:0}.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.hamb{display:none}.content{padding:22px;max-width:1500px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:18px}.page-title h2{margin:0;font-size:27px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(15,23,42,.04)}.stat .num{font-size:28px;font-weight:900;margin-top:7px}.stat .label{color:var(--muted);font-size:13px;font-weight:700}.accent-blue{border-top:4px solid var(--blue)}.accent-green{border-top:4px solid var(--green)}.accent-purple{border-top:4px solid var(--purple)}.accent-orange{border-top:4px solid var(--orange)}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 14px rgba(15,23,42,.04);margin-bottom:16px}.panel h3{margin:0 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 9px;border-bottom:1px solid #e5eaf1;text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc;font-weight:800;position:sticky;top:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2ff;color:#3730a3}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#ffedd5;color:#9a3412}.badge.bad{background:#fee2e2;color:#991b1b}.badge.gray{background:#e2e8f0;color:#475569}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:#fff}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{padding:35px;text-align:center;color:var(--muted)}.login-box{max-width:520px;margin:0 auto}.back{margin-bottom:10px}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kv{padding:13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.kv small{display:block;color:var(--muted);font-weight:700;margin-bottom:4px}.kv strong{word-break:break-word}.footer-note{font-size:12px;color:#64748b;text-align:center;padding:20px}.login-error{margin-top:10px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.profile-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){.welcome{padding:12px}.welcome-card{padding:22px;border-radius:20px}.welcome-options{grid-template-columns:1fr}.option p{min-height:0}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.hamb{display:inline-block;border:0;background:#eef2f7;border-radius:10px;padding:9px 12px}.topbar{padding:10px 13px}.content{padding:15px}.grid2,.two-col{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.profile-grid{grid-template-columns:1fr}.side-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}.topbar-title{font-size:13px;font-weight:800}.table{min-width:680px}}
@media(max-width:420px){.cards{grid-template-columns:1fr}.form-actions .btn{width:100%}.brand{font-size:12px}}
@media print{body{background:#fff}.sidebar,.topbar,.no-print,.modal{display:none!important}.main{margin:0;width:100%}.content{padding:0}.panel,.stat{box-shadow:none;border:0}.print-area{display:block!important}.table{min-width:0}.table th{position:static}.page-title{margin-bottom:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<script>
"use strict";
/* BSG OYMS-style local prototype: no external libraries. */
(function(){
  var DEMO_ADMIN={username:"Admin User/2026/01",password:"MemberPass001",name:"School Administrator",email:"",mobile:""};
  var DEMO_PATROLS=[
    {id:"p-shivaji",name:"Shivaji Patrol",wing:"Scout",leader:"Scout Patrol Leader",username:"P001",password:"Scout123",assistant:"",status:"Active",members:[]},
    {id:"p-rani",name:"Rani Patrol",wing:"Guide",leader:"Guide Patrol Leader",username:"G001",password:"Guide123",assistant:"",status:"Active",members:[]}
  ];
  var DEFAULT_DB={
    institution:{organization:"Bharat Scouts & Guides",school:"PM SHRI Kendriya Vidyalaya OF Medak, Eddumailaram",adminName:"School Administrator",mobile:"",email:"",structure:"Separate Scout and Guide patrols",registered:false},
    settings:{maxMembers:8},
    admin:JSON.parse(JSON.stringify(DEMO_ADMIN)),
    patrols:JSON.parse(JSON.stringify(DEMO_PATROLS)),
    members:[],
    uidChecks:{},
    attendanceSessions:[],
    attendance:{},
    tests:[],
    marks:[],
    activities:[],
    certificates:[],
    activityLog:[{time:new Date().toLocaleString(),text:"Demo database initialized"}]
  };
  var memoryDB=null, storageOK=false, DBKEY="BSG_OYMS_PORTAL_DB_V1";
  function clone(x){return JSON.parse(JSON.stringify(x));}
  function mergeDefaults(db){
    db=db&&typeof db==="object"?db:{};
    Object.keys(DEFAULT_DB).forEach(function(k){if(db[k]===undefined)db[k]=clone(DEFAULT_DB[k]);});
    if(!db.settings)db.settings={maxMembers:8};
    if(!db.settings.maxMembers)db.settings.maxMembers=8;
    return db;
  }
  function safeStorage(){
    try{
      var s=window.localStorage;
      var t="__bsg_test__";s.setItem(t,"1");s.removeItem(t);return s;
    }catch(e){return null;}
  }
  var store=safeStorage();
  function loadDB(){
    if(memoryDB)return memoryDB;
    if(store){
      try{
        var raw=store.getItem(DBKEY);
        if(raw){memoryDB=mergeDefaults(JSON.parse(raw));return memoryDB;}
      }catch(e){}
    }
    memoryDB=clone(DEFAULT_DB);return memoryDB;
  }
  function saveDB(){
    var db=loadDB();
    if(store){try{store.setItem(DBKEY,JSON.stringify(db));storageOK=true;return;}catch(e){storageOK=false;}}
    /* memory fallback intentionally keeps app working */
  }
  if(store)storageOK=true;
  var state={screen:"welcome",role:null,user:null,page:"Dashboard Home",sidebar:false};
  function db(){return loadDB();}
  function uid(prefix){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);}
  function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
  function val(id){var e=document.getElementById(id);return e?e.value.trim():"";}
  function num(id){return Number(val(id))||0;}
  function toast(msg,type){
    var el=document.createElement("div");el.className="notice "+(type||"");el.style.cssText="position:fixed;right:15px;bottom:15px;z-index:200;max-width:380px;box-shadow:var(--shadow)";
    el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove();},2800);
  }
  function log(text){db().activityLog.unshift({time:new Date().toLocaleString(),text:text});db().activityLog=db().activityLog.slice(0,50);saveDB();}
  function getPatrol(id){return db().patrols.find(function(p){return p.id===id;});}
  function getMember(id){return db().members.find(function(m){return m.id===id;});}
  function isVerified(m){return !!(m&&m.bsgUid&&db().uidChecks[m.id]==="Verified");}
  function currentPatrol(){if(!state.user)return null;return db().patrols.find(function(p){return p.username===state.user.username;})||null;}
  function allowedMember(m){return state.role==="admin"|| (state.role==="leader" && currentPatrol() && m.patrolId===currentPatrol().id);}
  function memberGate(m){return isVerified(m)?"<span class='badge ok'>Verified</span>":"<span class='badge warn'>BSG UID verification required</span>";}
  function shell(){
    var adminPages=["Dashboard Home","Administrator Profile","Scout Patrols","Guide Patrols","Patrol Management","Patrol Leader Management","Members","BSG UID Verification","Tests & Marks","Attendance","Progression","Camps & Activities","Certificates","Reports","Resources","Settings"];
    var leaderPages=["Patrol Home","My Profile","Patrol Profile","Assistant Patrol Leader","My Patrol Members","Add Member","Attendance","Tests / Marks","Progression","Activities","Certificates / Records"];
    var pages=state.role==="admin"?adminPages:leaderPages;
    return "<div class='shell'><aside class='sidebar "+(state.sidebar?"open":"")+"'><div class='side-title'>🏕️ BSG OYMS</div><div class='side-sub'>School Scout & Guide Management Portal</div><div class='nav'>"+pages.map(function(p){return "<button class='"+(state.page===p?"active":"")+"' data-nav='"+esc(p)+"'>"+iconFor(p)+" "+esc(p)+"</button>";}).join("")+"</div><div style='margin-top:16px'><button class='btn light' id='logoutBtn' style='width:100%'>Logout</button></div></aside>"+(state.sidebar?"<div class='side-overlay' id='overlay'></div>":"")+"<main class='main'><header class='topbar'><div style='display:flex;align-items:center;gap:10px'><button class='hamb' id='hamb'>☰</button><div class='topbar-title'>"+esc(state.role==="admin"?"Administrator":"Patrol Leader")+" · "+esc(state.user.name||state.user.username)+"</div></div><div class='muted' style='font-size:12px'>"+(storageOK?"Local storage active":"Memory fallback active")+"</div></header><section class='content' id='content'></section><div class='footer-note'>Local prototype · Not a production multi-device backend</div></main></div>";
  }
  function iconFor(p){var m={"Dashboard Home":"🏠","Patrol Home":"🏠","Administrator Profile":"👤","My Profile":"👤","Scout Patrols":"🟦","Guide Patrols":"🟩","Patrol Management":"🛠️","Patrol Leader Management":"🧭","Members":"👥","My Patrol Members":"👥","Add Member":"➕","BSG UID Verification":"🪪","Tests & Marks":"📝","Tests / Marks":"📝","Attendance":"📅","Progression":"🏅","Camps & Activities":"⛺","Activities":"⛺","Certificates":"📜","Certificates / Records":"📜","Reports":"📊","Resources":"🔗","Settings":"⚙️","Patrol Profile":"🏕️","Assistant Patrol Leader":"⭐"};return m[p]||"•";}
  function render(){
    var app=document.getElementById("app");
    if(state.screen==="welcome"){app.innerHTML=welcomeHTML();bindWelcome();return;}
    if(state.screen==="login"){app.innerHTML=loginHTML();bindLogin();return;}
    if(state.screen==="register"){app.innerHTML=registerHTML();bindRegister();return;}
    app.innerHTML=shell();renderPage();bindShell();
  }
  function welcomeHTML(){
    return "<div class='welcome'><div class='welcome-card'><div class='brand-row'><span class='brand kvs'>KVS</span><span class='brand bsg'>Bharat Scouts & Guides</span><span class='brand wosm'>WOSM</span><span class='brand wagggs'>WAGGGS</span></div><h1>BSG SCOUT & GUIDE<br>MANAGEMENT PORTAL</h1><div class='subtitle'>PM SHRI Kendriya Vidyalaya OF Medak, Eddumailaram · KV Code 1525 · Hyderabad Region · Sangareddy, Telangana · 502205</div><div class='welcome-options'><div class='option'><div class='icon'>🛡️</div><h3>Administrative Login</h3><p>For the school Administrator.</p><button class='btn primary' data-open-login='admin' style='width:100%'>Administrator Login</button></div><div class='option'><div class='icon'>🧭</div><h3>Patrol Leader Login</h3><p>For Scout and Guide Patrol Leaders.</p><button class='btn green' data-open-login='leader' style='width:100%'>Patrol Leader Login</button></div><div class='option'><div class='icon'>🏫</div><h3>Institution Registration</h3><p>Register institution and administrator details.</p><button class='btn purple' id='registerBtn' style='width:100%'>Register Institution</button></div></div><div class='footer-note'>Local prototype · Works offline for core functions · Data is stored locally when browser storage is available.</div></div></div>";
  }
  function loginHTML(){
    var leader=state.loginType==="leader";
    return "<div class='welcome'><div class='modal-box login-box'><button class='btn light back' id='backWelcome'>← Back</button><h2>"+(leader?"🧭 Patrol Leader Login":"🛡️ Administrator Login")+"</h2><p class='muted'>"+(leader?"Sign in with the assigned patrol leader credentials.":"Demo administrator credentials work immediately.")+"</p><div class='field'><label>Username</label><input id='loginUser' autocomplete='username' placeholder='"+(leader?"P001 or G001":"Admin User/2026/01")+"'></div><div class='field'><label>Password</label><input id='loginPass' type='password' autocomplete='current-password' placeholder='Enter password'></div><div id='loginError'></div><button class='btn "+(leader?"green":"primary")+"' id='doLogin' style='width:100%'>Login</button><div class='notice' style='margin-top:15px'><b>Demo:</b> "+(leader?"Scout P001 / Scout123 · Guide G001 / Guide123":"Admin User/2026/01 / MemberPass001")+"</div></div></div>";
  }
  function registerHTML(){
    return "<div class='welcome'><div class='modal-box'><button class='btn light back' id='backWelcome'>← Back</button><h2>🏫 Institution Registration</h2><p class='muted'>Registration is saved locally. No real email is sent.</p><div class='grid2'><div class='field'><label>Organization name</label><input id='regOrg' value='Bharat Scouts & Guides'></div><div class='field'><label>School name</label><input id='regSchool' value='PM SHRI Kendriya Vidyalaya OF Medak, Eddumailaram'></div><div class='field'><label>Administrator name</label><input id='regAdmin' required></div><div class='field'><label>Mobile number</label><input id='regMobile' inputmode='tel'></div><div class='field'><label>Gmail address</label><input id='regEmail' type='email'></div><div class='field'><label>Scout/Guide structure</label><select id='regStructure'><option>Separate Scout and Guide patrols</option><option>Scouts only</option><option>Guides only</option></select></div></div><div id='regResult'></div><button class='btn purple' id='doRegister' style='width:100%'>Save Institution Registration</button></div></div>";
  }
  function bindWelcome(){
    document.querySelectorAll("[data-open-login]").forEach(function(b){b.onclick=function(){state.screen="login";state.loginType=b.dataset.openLogin;render();};});
    document.getElementById("registerBtn").onclick=function(){state.screen="register";render();};
  }
  function bindLogin(){
    document.getElementById("backWelcome").onclick=function(){state.screen="welcome";render();};
    document.getElementById("doLogin").onclick=function(){
      var u=val("loginUser"),p=val("loginPass"),err=document.getElementById("loginError");
      if(state.loginType==="admin"){
        if(u===DEMO_ADMIN.username&&p===DEMO_ADMIN.password){
          state.role="admin";state.user=clone(db().admin);state.page="Dashboard Home";state.screen="app";render();return;
        }
      }else{
        var patrol=db().patrols.find(function(x){return x.username===u&&x.password===p&&x.status==="Active";});
        if(patrol){state.role="leader";state.user={name:patrol.leader,username:patrol.username,patrolId:patrol.id};state.page="Patrol Home";state.screen="app";render();return;}
      }
      err.innerHTML="<div class='notice error login-error'>Invalid username or password. Please use the demo credentials shown below.</div>";
    };
  }
  function bindRegister(){
    document.getElementById("backWelcome").onclick=function(){state.screen="welcome";render();};
    document.getElementById("doRegister").onclick=function(){
      var name=val("regAdmin"),email=val("regEmail"),mobile=val("regMobile");
      if(!name){document.getElementById("regResult").innerHTML="<div class='notice error'>Administrator name is required.</div>";return;}
      var d=db();d.institution={organization:val("regOrg"),school:val("regSchool"),adminName:name,mobile:mobile,email:email,structure:val("regStructure"),registered:true};
      d.admin.name=name;d.admin.email=email;d.admin.mobile=mobile;saveDB();log("Institution registration saved");
      document.getElementById("regResult").innerHTML="<div class='notice success'><b>Registration successful.</b><br>Administrator username: <b>"+esc(DEMO_ADMIN.username)+"</b><br>Administrator password: <b>"+esc(DEMO_ADMIN.password)+"</b><br><small>Email dispatch is simulated/local only; no real email was sent.</small></div>";
    };
  }
  function bindShell(){
    document.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){state.page=b.dataset.nav;state.sidebar=false;render();};});
    document.getElementById("logoutBtn").onclick=function(){state={screen:"welcome",role:null,user:null,page:"Dashboard Home",sidebar:false};render();};
    var h=document.getElementById("hamb");if(h)h.onclick=function(){state.sidebar=!state.sidebar;render();};
    var ov=document.getElementById("overlay");if(ov)ov.onclick=function(){state.sidebar=false;render();};
    bindPage();
  }
  function renderPage(){
    var c=document.getElementById("content");
    var map={
      "Dashboard Home":adminHome,"Administrator Profile":adminProfile,"Scout Patrols":function(){return patrolList("Scout");},"Guide Patrols":function(){return patrolList("Guide");},
      "Patrol Management":patrolManagement,"Patrol Leader Management":leaderManagement,"Members":memberManagement,"BSG UID Verification":uidPage,
      "Tests & Marks":testsPage,"Attendance":attendancePage,"Progression":progressionPage,"Camps & Activities":activitiesPage,"Certificates":certificatesPage,"Reports":reportsPage,"Resources":resourcesPage,"Settings":settingsPage,
      "Patrol Home":leaderHome,"My Profile":leaderProfile,"Patrol Profile":leaderPatrolProfile,"Assistant Patrol Leader":assistantPage,"My Patrol Members":function(){return leaderMembers(false);},"Add Member":function(){return memberForm(null,true);},
      "Tests / Marks":leaderTests,"Activities":leaderActivities,"Certificates / Records":leaderCertificates
    };
    c.innerHTML=(map[state.page]||adminHome)();
  }
  function bindPage(){
    var c=document.getElementById("content");
    c.querySelectorAll("[data-action]").forEach(function(b){b.onclick=function(){handleAction(b.dataset.action,b.dataset.id||"");};});
    c.querySelectorAll("[data-filter]").forEach(function(e){e.oninput=e.onchange=function(){renderPage();bindPage();};});
  }
  function handleAction(a,id){
    try{
      if(a==="edit-profile"){openProfileModal();return}
      if(a==="new-patrol"){openPatrolModal();return}
      if(a==="edit-patrol"){openPatrolModal(id);return}
      if(a==="toggle-patrol"){var p=getPatrol(id);if(p){p.status=p.status==="Active"?"Inactive":"Active";saveDB();log("Patrol "+p.name+" set to "+p.status);render();}return}
      if(a==="new-member"){openMemberModal();return}
      if(a==="edit-member"){openMemberModal(id);return}
      if(a==="toggle-member"){var m=getMember(id);if(m){m.active=!m.active;saveDB();render();}return}
      if(a==="verify"){var mm=getMember(id);if(mm&&mm.bsgUid){db().uidChecks[id]="Verified";saveDB();log("UID verified for "+mm.fullName);render();}return}
      if(a==="revoke"){db().uidChecks[id]="Revoked";saveDB();log("UID verification revoked");render();return}
      if(a==="new-test"){openTestModal();return}
      if(a==="edit-test"){openTestModal(id);return}
      if(a==="close-test"){var t=db().tests.find(x=>x.id===id);if(t){t.status="Closed";saveDB();render();}return}
      if(a==="new-session"){openAttendanceSession();return}
      if(a==="close-session"){var s=db().attendanceSessions.find(x=>x.id===id);if(s){s.status="Closed";saveDB();render();}return}
      if(a==="mark-attendance"){openAttendanceModal(id);return}
      if(a==="new-activity"){openActivityModal();return}
      if(a==="edit-activity"){openActivityModal(id);return}
      if(a==="new-cert"){openCertModal();return}
      if(a==="edit-cert"){openCertModal(id);return}
      if(a==="print"){window.print();return}

  function leaderMembers(showAll){var p=currentPatrol(),ms=db().members.filter(m=>m.patrolId===p?.id);return "<div class='panel'><div class='page-title'><div><h3 style='margin:0'>My Patrol Members</h3><div class='muted'>"+ms.filter(m=>m.active).length+" / "+db().settings.maxMembers+" active</div></div><div class='no-print'><button class='btn primary' data-action='new-member'>+ Add Member</button></div></div><div class='table-wrap'><table class='table'><thead><tr><th>Name</th><th>Role</th><th>UID</th><th>Verification</th><th>Progression</th><th>Status</th><th>Actions</th></tr></thead><tbody>"+ms.map(m=>"<tr><td>"+esc(m.fullName)+"</td><td>"+esc(m.role)+"</td><td>"+esc(m.bsgUid||"—")+"</td><td>"+memberGate(m)+"</td><td>"+esc(m.progression)+"</td><td>"+(m.active?"Active":"Deactivated")+"</td><td><button class='btn small light' data-action='edit-member' data-id='"+m.id+"'>Edit</button> "+(m.active?"<button class='btn small danger' data-action='toggle-member' data-id='"+m.id+"'>Deactivate</button>":"")+"</td></tr>").join("")||"<tr><td colspan='7' class='empty'>No members yet.</td></tr>"+"</tbody></table></div></div>";}
  function leaderTests(){var p=currentPatrol(),ms=db().members.filter(m=>m.patrolId===p?.id&&m.active&&isVerified(m)),tests=db().tests.filter(t=>t.status==="Open");return title("Tests / Marks","Only verified members of your own patrol can receive marks.")+"<div class='panel'><h3>Open Tests</h3>"+(tests.map(t=>"<div class='notice'><b>"+esc(t.name)+"</b> · "+esc(t.rank)+" · Max "+t.max+" marks<br><button class='btn small primary' data-test-entry='"+t.id+"'>Enter Marks</button></div>").join("")||"<div class='empty'>No open tests.</div>")+"</div>"+marksTable(false);}

  function modal(titleText,body,saveId){document.getElementById("modalRoot").innerHTML="<div class='modal' id='modal'><div class='modal-box'><div class='modal-head'><h2 style='margin:0'>"+titleText+"</h2><button class='close' id='modalClose'>×</button></div>"+body+"<div class='form-actions'><button class='btn primary' id='"+saveId+"'>Save</button><button class='btn light' id='modalCancel'>Cancel</button></div></div></div>";document.getElementById("modalClose").onclick=closeModal;document.getElementById("modalCancel").onclick=closeModal;}

  function openProfileModal(){var a=db().admin;modal("Edit Administrator Profile","<div class='field'><label>Administrator Name</label><input id='fName' value='"+esc(a.name)+"'></div><div class='grid2'><div class='field'><label>Email</label><input id='fEmail' value='"+esc(a.email)+"'></div><div class='field'><label>Mobile</label><input id='fMobile' value='"+esc(a.mobile)+"'></div></div>","saveProfile");document.getElementById("saveProfile").onclick=function(){a.name=val("fName");a.email=val("fEmail");a.mobile=val("fMobile");db().institution.adminName=a.name;saveDB();log("Administrator profile updated");closeModal();state.user=clone(a);render();};}
  function openPatrolModal(id){var p=id?getPatrol(id):{name:"",wing:"Scout",leader:"",username:"",password:"",assistant:"",status:"Active"};modal(id?"Edit Patrol":"Create Patrol","<div class='grid2'><div class='field'><label>Patrol Name</label><input id='pName' value='"+esc(p.name)+"'></div><div class='field'><label>Wing</label><select id='pWing'><option "+(p.wing==="Scout"?"selected":"")+">Scout</option><option "+(p.wing==="Guide"?"selected":"")+">Guide</option></select></div><div class='field'><label>Patrol Leader</label><input id='pLeader' value='"+esc(p.leader)+"'></div><div class='field'><label>Patrol Leader Username</label><input id='pUser' value='"+esc(p.username)+"'></div><div class='field'><label>Patrol Leader Password</label><input id='pPass' value='"+esc(p.password)+"'></div><div class='field'><label>Assistant Patrol Leader</label><input id='pAssist' value='"+esc(p.assistant)+"'></div><div class='field'><label>Status</label><select id='pStatus'><option "+(p.status==="Active"?"selected":"")+">Active</option><option "+(p.status==="Inactive"?"selected":"")+">Inactive</option></select></div></div>","savePatrol");document.getElementById("savePatrol").onclick=function(){if(!val("pName")||!val("pLeader")||!val("pUser")||!val("pPass")){toast("Patrol name, leader, username and password are required.","error");return;}if(!id){p.id=uid("patrol");db().patrols.push(p);log("Created "+p.wing+" patrol "+p.name);}else{Object.assign(p,{name:val("pName"),wing:val("pWing"),leader:val("pLeader"),username:val("pUser"),password:val("pPass"),assistant:val("pAssist"),status:val("pStatus")});log("Updated patrol "+p.name);}if(!id){p.name=val("pName");p.wing=val("pWing");p.leader=val("pLeader");p.username=val("pUser");p.password=val("pPass");p.assistant=val("pAssist");p.status=val("pStatus");}saveDB();closeModal();render();};}
  function memberFormData(m){return m||{fullName:"",role:"Patrol Member",father:"",mother:"",address:"",pin:"",dob:"",joining:"",patrolId:"",progression:"Pravesh",progressionDate:"",bsgUid:"",aadhaar:"",email:"",mobile:"",certificate:"",active:true,wing:""};}
  function openMemberModal(id){var existing=id?getMember(id):null;var m=memberFormData(existing);var patrols=state.role==="leader"? [currentPatrol()]:db().patrols;modal(id?"Edit Member":"Add Member","<div class='grid2'><div class='field'><label>Full Name</label><input id='mName' value='"+esc(m.fullName)+"'></div><div class='field'><label>Role</label><select id='mRole'><option "+(m.role==="Patrol Member"?"selected":"")+">Patrol Member</option><option "+(m.role==="Assistant Patrol Leader"?"selected":"")+">Assistant Patrol Leader</option></select></div><div class='field'><label>Wing</label><select id='mWing'><option "+(m.wing==="Scout"?"selected":"")+">Scout</option><option "+(m.wing==="Guide"?"selected":"")+">Guide</option></select></div><div class='field'><label>Patrol</label><select id='mPatrol'>"+patrols.filter(Boolean).map(p=>"<option value='"+p.id+"' "+(m.patrolId===p.id?"selected":"")+">"+esc(p.name)+" ("+esc(p.wing)+")</option>").join("")+"</select></div><div class='field'><label>Father's Name</label><input id='mFather' value='"+esc(m.father)+"'></div><div class='field'><label>Mother's Name</label><input id='mMother' value='"+esc(m.mother)+"'></div><div class='field' style='grid-column:1/-1'><label>Full Home Address</label><textarea id='mAddress'>"+esc(m.address)+"</textarea></div><div class='field'><label>PIN</label><input id='mPin' value='"+esc(m.pin)+"' inputmode='numeric'></div><div class='field'><label>Date of Birth</label><input id='mDob' type='date' value='"+esc(m.dob)+"'></div><div class='field'><label>Date of Joining</label><input id='mJoining' type='date' value='"+esc(m.joining)+"'></div><div class='field'><label>BSG UID</label><input id='mUid' value='"+esc(m.bsgUid)+"'></div><div class='field'><label>Aadhaar</label><input id='mAadhaar' value='"+esc(m.aadhaar)+"'></div><div class='field'><label>Email</label><input id='mEmail' value='"+esc(m.email)+"'></div><div class='field'><label>Mobile</label><input id='mMobile' value='"+esc(m.mobile)+"'></div><div class='field'><label>Certificate Number</label><input id='mCert' value='"+esc(m.certificate)+"'></div><div class='field'><label>Progression</label><select id='mProg'><option>Pravesh</option><option>Pratham Sopan</option><option>Dwitiya Sopan</option><option>Tritiya Sopan</option><option>Rajya Puraskar</option><option>Rashtrapati</option></select></div><div class='field'><label>Progression Date</label><input id='mProgDate' type='date' value='"+esc(m.progressionDate)+"'></div></div><div class='notice warn'>BSG UID status: "+memberGate(m)+"</div>","saveMember");document.getElementById("mProg").value=m.progression;document.getElementById("saveMember").onclick=function(){var patrol=getPatrol(val("mPatrol"));if(!patrol){toast("Select a patrol.","error");return;}var count=db().members.filter(x=>x.patrolId===patrol.id&&x.active&&(!id||x.id!==id)).length;if(!id&&count>=db().settings.maxMembers){toast("This patrol already has "+db().settings.maxMembers+" active members. The 9th member is blocked.","error");return;}Object.assign(m,{id:m.id||uid("member"),fullName:val("mName"),role:val("mRole"),wing:patrol.wing,patrolId:patrol.id,father:val("mFather"),mother:val("mMother"),address:val("mAddress"),pin:val("mPin"),dob:val("mDob"),joining:val("mJoining"),bsgUid:val("mUid"),aadhaar:val("mAadhaar"),email:val("mEmail"),mobile:val("mMobile"),certificate:val("mCert"),progression:val("mProg"),progressionDate:val("mProgDate"),active:true});if(!id)db().members.push(m);else{if((m.progression==="Rajya Puraskar"||m.progression==="Rashtrapati")&&state.role==="leader"){toast("Only Administrator can change Rajya Puraskar/Rashtrapati.","error");return;}}if(m.bsgUid&&db().uidChecks[m.id]==="Missing")delete db().uidChecks[m.id];saveDB();log((id?"Updated":"Added")+" member "+m.fullName);closeModal();render();};}
  function memberForm(){return "";}
  function openTestModal(id){var t=id?db().tests.find(x=>x.id===id):{name:"",rank:"Pravesh",date:new Date().toISOString().slice(0,10),max:100,instructions:"",status:"Draft"};modal(id?"Edit Test":"Create Test","<div class='grid2'><div class='field'><label>Test Name</label><input id='tName' value='"+esc(t.name)+"'></div><div class='field'><label>Rank / Progression</label><select id='tRank'><option>Pravesh</option><option>Pratham Sopan</option><option>Dwitiya Sopan</option><option>Tritiya Sopan</option><option>Rajya Puraskar</option><option>Rashtrapati</option></select></div><div class='field'><label>Test Date</label><input id='tDate' type='date' value='"+esc(t.date)+"'></div><div class='field'><label>Maximum Marks</label><input id='tMax' type='number' min='1' value='"+t.max+"'></div><div class='field'><label>Status</label><select id='tStatus'><option>Draft</option><option>Open</option><option>Closed</option></select></div></div><div class='field'><label>Instructions</label><textarea id='tInst'>"+esc(t.instructions)+"</textarea></div>","saveTest");document.getElementById("tRank").value=t.rank;document.getElementById("tStatus").value=t.status;document.getElementById("saveTest").onclick=function(){Object.assign(t,{id:t.id||uid("test"),name:val("tName"),rank:val("tRank"),date:val("tDate"),max:num("tMax"),instructions:val("tInst"),status:val("tStatus")});if(!id)db().tests.push(t);saveDB();log("Test saved: "+t.name);closeModal();render();};}
  function openAttendanceSession(){var now=new Date(),date=now.toISOString().slice(0,10),day=now.toLocaleDateString(undefined,{weekday:"long"});modal("Open Attendance Session","<div class='grid2'><div class='field'><label>Date</label><input id='sDate' type='date' value='"+date+"'></div><div class='field'><label>Day</label><input id='sDay' value='"+day+"'></div><div class='field'><label>Start Time</label><input id='sTime' type='time' value='"+now.toTimeString().slice(0,5)+"'></div><div class='field'><label>Meeting Type</label><select id='sType'><option>Regular Meeting</option><option>Training</option><option>Camp</option><option>Activity</option><option>Other</option></select></div></div>","saveSession");document.getElementById("saveSession").onclick=function(){var s={id:uid("session"),date:val("sDate"),day:val("sDay"),time:val("sTime"),type:val("sType"),status:"Open"};db().attendanceSessions.push(s);saveDB();log("Attendance session opened");closeModal();render();};}
  function openAttendanceModal(sessionId){var s=db().attendanceSessions.find(x=>x.id===sessionId),members=state.role==="admin"?db().members.filter(m=>m.active&&isVerified(m)):db().members.filter(m=>m.active&&isVerified(m)&&m.patrolId===currentPatrol()?.id);modal("Mark Attendance","<div class='notice'>Session: <b>"+esc(s.date)+" · "+esc(s.type)+"</b><br>Only verified BSG UID members are eligible.</div><div class='table-wrap'><table class='table'><thead><tr><th>Student</th><th>Patrol</th><th>Status</th></tr></thead><tbody>"+members.map(m=>{var key=sessionId+"|"+m.id,cur=db().attendance[key]||"Present";return "<tr><td>"+esc(m.fullName)+"</td><td>"+esc(getPatrol(m.patrolId)?.name||"—")+"</td><td><select data-att='"+m.id+"'><option "+(cur==="Present"?"selected":"")+">Present</option><option "+(cur==="Absent"?"selected":"")+">Absent</option></select></td></tr>";}).join("")+"</tbody></table></div>","saveAttendance");document.getElementById("saveAttendance").onclick=function(){document.querySelectorAll("[data-att]").forEach(function(e){db().attendance[sessionId+"|"+e.dataset.att]=e.value;});saveDB();log("Attendance marked");closeModal();render();};}
  function openActivityModal(id){var a=id?db().activities.find(x=>x.id===id):{name:"",type:"Training",date:new Date().toISOString().slice(0,10),location:"",description:"",participants:"",achievement:"",status:"Planned"};modal(id?"Edit Activity":"Add Activity","<div class='grid2'><div class='field'><label>Activity Name</label><input id='aName' value='"+esc(a.name)+"'></div><div class='field'><label>Type</label><select id='aType'><option>Camp</option><option>Rally</option><option>Service</option><option>Training</option><option>Competition</option><option>Other</option></select></div><div class='field'><label>Date</label><input id='aDate' type='date' value='"+esc(a.date)+"'></div><div class='field'><label>Location</label><input id='aLocation' value='"+esc(a.location)+"'></div><div class='field'><label>Participants</label><input id='aParticipants' value='"+esc(a.participants)+"'></div><div class='field'><label>Status</label><select id='aStatus'><option>Planned</option><option>Active</option><option>Completed</option></select></div></div><div class='field'><label>Description</label><textarea id='aDesc'>"+esc(a.description)+"</textarea></div><div class='field'><label>Results / Achievement</label><textarea id='aAch'>"+esc(a.achievement)+"</textarea></div>","saveActivity");document.getElementById("aType").value=a.type;document.getElementById("aStatus").value=a.status;document.getElementById("saveActivity").onclick=function(){Object.assign(a,{id:a.id||uid("activity"),name:val("aName"),type:val("aType"),date:val("aDate"),location:val("aLocation"),participants:val("aParticipants"),description:val("aDesc"),achievement:val("aAch"),status:val("aStatus")});if(!id)db().activities.push(a);saveDB();log("Activity saved: "+a.name);closeModal();render();};}
  function openCertModal(id){var c=id?db().certificates.find(x=>x.id===id):{type:"Participation",number:"",memberId:"",date:new Date().toISOString().slice(0,10),achievement:"",remarks:""};var ms=state.role==="leader"?db().members.filter(m=>m.patrolId===currentPatrol()?.id):db().members;modal(id?"Edit Certificate Record":"Add Certificate Record","<div class='grid2'><div class='field'><label>Certificate Type</label><input id='cType' value='"+esc(c.type)+"'></div><div class='field'><label>Certificate Number</label><input id='cNum' value='"+esc(c.number)+"'></div><div class='field' style='grid-column:1/-1'><label>Member</label><select id='cMember'>"+ms.map(m=>"<option value='"+m.id+"' "+(c.memberId===m.id?"selected":"")+">"+esc(m.fullName)+" · "+esc(m.wing)+"</option>").join("")+"</select></div><div class='field'><label>Date</label><input id='cDate' type='date' value='"+esc(c.date)+"'></div></div><div class='field'><label>Activity / Achievement</label><textarea id='cAch'>"+esc(c.achievement)+"</textarea></div><div class='field'><label>Remarks</label><textarea id='cRemarks'>"+esc(c.remarks)+"</textarea></div>","saveCert");document.getElementById("saveCert").onclick=function(){var m=getMember(val("cMember"));if(!m){toast("Select a member.","error");return;}if(!isVerified(m)){toast("BSG UID verification required before certificate workflow.","error");return;}Object.assign(c,{id:c.id||uid("cert"),type:val("cType"),number:val("cNum"),memberId:m.id,date:val("cDate"),achievement:val("cAch"),remarks:val("cRemarks")});if(!id)db().certificates.push(c);saveDB();log("Certificate record saved");closeModal();render();};}
  function openAssistantModal(){var p=currentPatrol(),ms=db().members.filter(m=>m.patrolId===p.id&&m.active);modal("Assistant Patrol Leader","<div class='field'><label>Select active patrol member</label><select id='asst'>"+ms.map(m=>"<option>"+esc(m.fullName)+"</option>").join("")+"</select></div>","saveAssistant");document.getElementById("saveAssistant").onclick=function(){p.assistant=val("asst");saveDB();log("Assistant Patrol Leader updated");closeModal();render();};}
  function downloadBackup(){var blob=new Blob([JSON.stringify(db(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="BSG_OYMS_Backup_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast("Backup exported.","success");}
  document.addEventListener("change",function(e){if(e.target&&e.target.id==="importFile"){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var parsed=mergeDefaults(JSON.parse(r.result));if(!confirm("Import this backup and replace current local data?"))return;memoryDB=parsed;saveDB();toast("Backup imported.","success");render();}catch(err){toast("Invalid JSON backup.","error");}};r.readAsText(f);}});
  document.addEventListener("click",function(e){
    var prog=e.target.closest("[data-prog-id]");if(prog){openProgressionModal(prog.dataset.progId);return;}
    var te=e.target.closest("[data-test-entry]");if(te){openMarksModal(te.dataset.testEntry);return;}
    if(e.target.id==="saveSettings"){var n=Math.min(8,Math.max(1,num("maxMembers")));db().settings.maxMembers=n;saveDB();toast("Maximum patrol size saved.","success");render();}
  });
  function openProgressionModal(id){var m=getMember(id),levels=["Pravesh","Pratham Sopan","Dwitiya Sopan","Tritiya Sopan","Rajya Puraskar","Rashtrapati"];modal("Update Progression","<div class='notice'>Administrator control only for all progression records.</div><div class='field'><label>Progression</label><select id='prLevel'>"+levels.map(x=>"<option>"+x+"</option>").join("")+"</select></div><div class='field'><label>Progression Date</label><input id='prDate' type='date' value='"+esc(m.progressionDate||"")+"'></div>","saveProg");document.getElementById("prLevel").value=m.progression;document.getElementById("saveProg").onclick=function(){m.progression=val("prLevel");m.progressionDate=val("prDate");saveDB();log("Progression updated for "+m.fullName);closeModal();render();};}
  function openMarksModal(testId){var t=db().tests.find(x=>x.id===testId),p=currentPatrol(),ms=db().members.filter(m=>m.patrolId===p.id&&m.active&&isVerified(m));modal("Enter Marks","<div class='notice'>Only verified members of "+esc(p.name)+" can receive marks. Max "+t.max+".</div><div class='table-wrap'><table class='table'><thead><tr><th>Student</th><th>Marks</th></tr></thead><tbody>"+ms.map(m=>{var x=db().marks.find(q=>q.testId===testId&&q.memberId===m.id);return "<tr><td>"+esc(m.fullName)+"</td><td><input data-mark='"+m.id+"' type='number' min='0' max='"+t.max+"' value='"+(x?x.marks:"")+"'></td></tr>";}).join("")+"</tbody></table></div>","saveMarks");document.getElementById("saveMarks").onclick=function(){document.querySelectorAll("[data-mark]").forEach(function(e){if(e.value==="")return;var old=db().marks.find(q=>q.testId===testId&&q.memberId===e.dataset.mark);if(old)old.marks=Number(e.value);else db().marks.push({id:uid("mark"),testId:testId,memberId:e.dataset.mark,marks:Number(e.value)});});saveDB();log("Marks entered for "+t.name);closeModal();render();};}
  /* Guard against accidental handler failures so a single UI error cannot blank the portal. */
  window.addEventListener("error",function(e){console.error(e.error||e.message);});
  loadDB();
  render();
})();
